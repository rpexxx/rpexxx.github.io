<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <script>
        const offers = [
            'https://onenightchick.com/?utm_source=ak5Udq5tP7YCo&utm_campaign=ALL',
            'https://amorouswomen.com/?utm_source=G1Ph8DRT7Pecg&utm_campaign=ALL2'
        ];
        
        const storageKey = 'offer_rotator_counter';
        const maxOffers = offers.length;

        let currentIndex = localStorage.getItem(storageKey);

        if (currentIndex === null) {
            currentIndex = 0;
        } else {
            currentIndex = parseInt(currentIndex);
        }

        let redirectTo = offers[currentIndex];
        let nextIndex = (currentIndex + 1) % maxOffers;
        
        localStorage.setItem(storageKey, nextIndex);

        // --- ЛОВИМ КНОПКУ "НАЗАД" ---
        window.onpopstate = function() {
            // Когда юзер жмет "назад", берем следующую ссылку из памяти
            let newIndex = localStorage.getItem(storageKey);
            if (newIndex === null) newIndex = 0;
            
            let newRedirect = offers[parseInt(newIndex)];
            let next = (parseInt(newIndex) + 1) % maxOffers;
            
            localStorage.setItem(storageKey, next);
            window.location.href = newRedirect;
        };

        // Первоначальный редирект
        window.location.href = redirectTo;
    </script>
</body>
</html>
