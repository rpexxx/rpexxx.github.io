<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <script>
        // Оставляем только 2 ссылки
        const offers = [
            'https://onenightchick.com/?utm_source=ak5Udq5tP7YCo&utm_campaign=ALL',
            'https://amorouswomen.com/?utm_source=G1Ph8DRT7Pecg&utm_campaign=ALL2'
        ];
        
        // Определяем, на какой ссылке мы сейчас (с помощью хэша в URL)
        // Если в URL нет #step=..., значит мы на первом шаге
        let currentStep = window.location.hash === '#step=2' ? 1 : 0;
        
        // Выбираем ссылку на основе текущего шага
        let redirectTo = offers[currentStep];
        
        // Записываем в историю фейковую страницу, чтобы перехватить кнопку "Назад"
        history.pushState(null, null, location.href);

        // Ловим нажатие на "Назад"
        window.onpopstate = function () {
            // Определяем, куда перекинуть при нажатии "Назад"
            // Если мы сейчас на 1-й ссылке (step=0), то кидаем на 2-ю (step=1). И наоборот.
            let nextStep = currentStep === 0 ? 1 : 0;
            
            // Меняем хэш в URL, чтобы при следующем "Назад" скрипт понял, где он
            window.location.hash = nextStep === 1 ? '#step=2' : '#step=1';
            
            // Делаем редирект на противоположную ссылку
            window.location.href = offers[nextStep];
            
            // Возвращаем фейковую запись, чтобы снова перехватить кнопку "Назад"
            history.pushState(null, null, location.href);
        };

        // Первоначальный редирект
        // Чтобы не зациклиться при самой первой загрузке, ставим хэш
        if (!window.location.hash) {
            window.location.hash = '#step=1';
        }
        window.location.href = redirectTo;
    </script>
</body>
</html>
